services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the root .env}
      UPLOAD_DIR: /app/uploads
      VECTOR_DATA_DIR: /app/vector_data
      HF_HOME: /app/model_cache
    networks:
      - default
      - existing_postgres
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - faiss_data:/app/vector_data
      - resume_uploads:/app/uploads
      - model_cache:/app/model_cache

  frontend:
    build:
      context: ./frontend/my-app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  faiss_data:
    name: airesumescreening_faiss_data
    external: true
  resume_uploads:
    name: airesumescreening_resume_uploads
    external: true
  model_cache:
    name: airesumescreening_model_cache
    external: true

networks:
  default:
    name: hirewise_default
  existing_postgres:
    name: airesumescreening_default
    external: true
