
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/my-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/my-app/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ci_resume
          POSTGRES_USER: ci_resume
          POSTGRES_PASSWORD: ci_resume_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_resume -d ci_resume"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m compileall -q app alembic

      - run: alembic heads
        env:
          DATABASE_URL: postgresql://ci_resume:ci_resume_password@127.0.0.1:5432/ci_resume

      - run: alembic history
        env:
          DATABASE_URL: postgresql://ci_resume:ci_resume_password@127.0.0.1:5432/ci_resume

      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql://ci_resume:ci_resume_password@127.0.0.1:5432/ci_resume
