
name: Deploy to EC2 (manual)

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact verified 40-character commit SHA to deploy"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Validate release SHA
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.commit_sha }}
        run: |
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Enter the full 40-character lowercase commit SHA." >&2
            exit 1
          fi

      - name: Check out exact release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1

      - name: Verify checked-out revision
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.commit_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1
          role-session-name: HirewiseProductionDeploy

      - name: Verify AWS identity and SSM instance
        shell: bash
        run: |
          aws sts get-caller-identity
          aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=i-0f66d30dc1d60be50" \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text | grep -x Online

      - name: Prepare protected deployment script
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.commit_sha }}
        run: |
          cat > "$RUNNER_TEMP/hirewise-deploy.sh" <<'REMOTE'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          release_sha="$1"
          expected_revision="20261015_02"
          checkout_dir="/home/ubuntu/hirewise"

          cd "$checkout_dir"

          for f in .env.prod backend/.env.prod; do
            test -f "$f"
            test "$(stat -c '%a' "$f")" = "600"
          done

          root_env_before="$(sha256sum .env.prod)"
          backend_env_before="$(sha256sum backend/.env.prod)"

          git fetch --prune origin "$release_sha"
          git cat-file -e "$release_sha^{commit}"

          for f in .env.prod backend/.env.prod; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "Refusing: production environment file is tracked: $f" >&2
              exit 1
            fi
            if git cat-file -e "$release_sha:$f" 2>/dev/null; then
              echo "Refusing: release contains production environment file: $f" >&2
              exit 1
            fi
          done

          for f in docker-compose.prod.yml deploy/nginx.conf; do
            target_blob="$(git rev-parse "$release_sha:$f")"
            if [[ -f "$f" ]]; then
              [[ "$(git hash-object "$f")" = "$target_blob" ]] || {
                echo "Deployment file differs from release: $f" >&2
                exit 1
              }
            fi
          done

          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "Refusing deployment: tracked local changes exist." >&2
            exit 1
          fi

          git checkout --detach "$release_sha"

          [[ "$(sha256sum .env.prod)" == "$root_env_before" ]]
          [[ "$(sha256sum backend/.env.prod)" == "$backend_env_before" ]]

          for f in .env.prod backend/.env.prod docker-compose.prod.yml deploy/nginx.conf; do
            test -f "$f"
          done

          dc() {
            docker compose --env-file .env.prod -f docker-compose.prod.yml "$@"
          }

          docker info >/dev/null
          dc config --quiet

          # Never bootstrap an empty database or substitute a new volume.
          postgres_id="$(dc ps -aq postgres)"
          [[ -n "$postgres_id" ]]
          [[ "$(wc -l <<< "$postgres_id")" = "1" ]]

          configured_volume="$(dc config --format json | python3 -c \
            'import json,sys; print(json.load(sys.stdin)["volumes"]["postgres_data"].get("name",""))')"

          actual_volume="$(docker inspect -f \
            '{{range .Mounts}}{{if eq .Destination "/var/lib/postgresql/data"}}{{.Name}}{{end}}{{end}}' \
            "$postgres_id")"

          [[ -n "$configured_volume" ]]
          [[ -n "$actual_volume" ]]
          [[ "$actual_volume" = "$configured_volume" ]]
          docker volume inspect "$actual_volume" >/dev/null

          dc up -d postgres

          ready=false
          for attempt in {1..30}; do
            if dc exec -T postgres pg_isready >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 5
          done
          [[ "$ready" = true ]] || {
            dc logs --tail=100 postgres >&2 || true
            exit 1
          }

          table_state="$(dc exec -T postgres sh -c \
            'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -F "|" -Atqc "SELECT (to_regclass('\''public.users'\'') IS NOT NULL)::int, (to_regclass('\''public.resumes'\'') IS NOT NULL)::int, (to_regclass('\''public.alembic_version'\'') IS NOT NULL)::int"')"

          [[ "$table_state" = "1|1|1" ]] || {
            echo "Essential database tables missing; refusing deployment." >&2
            exit 1
          }

          revision_state="$(dc exec -T postgres sh -c \
            'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -F "|" -Atqc "SELECT count(*), coalesce((SELECT version_num FROM alembic_version LIMIT 1)::text, '\''UNSET'\'')"')"

          [[ "$revision_state" = "1|$expected_revision" ]] || {
            echo "Unexpected database revision; refusing deployment." >&2
            exit 1
          }

          dc build

          current_state="$(dc run --rm --no-deps backend alembic current)"
          grep -Fq "$expected_revision" <<< "$current_state"

          heads_state="$(dc run --rm --no-deps backend alembic heads)"
          [[ -n "$heads_state" ]]

          dc run --rm --no-deps backend alembic upgrade head
          dc up -d

          healthy=false
          for attempt in {1..36}; do
            all_healthy=true

            for service in postgres backend frontend; do
              service_id="$(dc ps -q "$service")"
              if [[ -z "$service_id" ]] ||
                 [[ "$(docker inspect -f '{{.State.Status}}' "$service_id")" != "running" ]] ||
                 [[ "$(docker inspect -f '{{.State.Health.Status}}' "$service_id" 2>/dev/null || true)" != "healthy" ]]; then
                all_healthy=false
              fi
            done

            nginx_id="$(dc ps -q nginx)"
            if [[ -z "$nginx_id" ]] ||
               [[ "$(docker inspect -f '{{.State.Status}}' "$nginx_id" 2>/dev/null || true)" != "running" ]]; then
              all_healthy=false
            fi

            if [[ "$all_healthy" = true ]] &&
               curl --fail --silent http://127.0.0.1/api/health >/dev/null &&
               curl --fail --silent http://127.0.0.1/ >/dev/null; then
              healthy=true
              break
            fi
            sleep 5
          done

          if [[ "$healthy" != true ]]; then
            dc ps >&2 || true
            dc logs --tail=150 backend frontend nginx >&2 || true
            exit 1
          fi

          dc ps
          REMOTE

          chmod 600 "$RUNNER_TEMP/hirewise-deploy.sh"

          # Split the script into short chunks so each SSM command stays small.
          base64 -w 0 "$RUNNER_TEMP/hirewise-deploy.sh" > "$RUNNER_TEMP/hirewise-deploy.b64"
          split -b 2500 -d "$RUNNER_TEMP/hirewise-deploy.b64" "$RUNNER_TEMP/chunk-"

          python3 - "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$RELEASE_SHA" <<'PY'
          import glob, json, os, sys

          directory, run_id, sha = sys.argv[1:]
          prefix = f"hirewise-deploy-{run_id}"
          remote_b64 = f"/tmp/{prefix}.b64"
          remote_script = f"/tmp/{prefix}.sh"

          commands = [f"rm -f {remote_b64} {remote_script}"]
          for filename in sorted(glob.glob(os.path.join(directory, "chunk-*"))):
              with open(filename, encoding="ascii") as file:
                  chunk = file.read()
              commands.append(f"printf '%s' '{chunk}' >> {remote_b64}")

          commands.extend([
              f"base64 -d {remote_b64} > {remote_script}",
              f"chmod 644 {remote_script}",
              f"sudo -u ubuntu bash {remote_script} {sha}",
              f"rm -f {remote_b64} {remote_script}"
          ])

          payload = {
              "DocumentName": "AWS-RunShellScript",
              "InstanceIds": ["i-0f66d30dc1d60be50"],
              "Comment": f"Hirewise production deployment {sha}",
              "TimeoutSeconds": 1800,
              "Parameters": {"commands": commands}
          }

          with open(os.path.join(directory, "ssm-input.json"), "w") as file:
              json.dump(payload, file)
          PY

      - name: Send deployment through SSM
        id: deploy
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.commit_sha }}
        run: |
          command_id="$(aws ssm send-command \
            --cli-input-json "file://$RUNNER_TEMP/ssm-input.json" \
            --query 'Command.CommandId' \
            --output text)"

          echo "SSM command ID: $command_id"

          for attempt in {1..90}; do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id i-0f66d30dc1d60be50 \
              --query 'Status' \
              --output text 2>/dev/null || true)"

            case "$status" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id i-0f66d30dc1d60be50 \
                  --query 'StandardOutputContent' --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id i-0f66d30dc1d60be50 \
                  --query '{Status:Status,Error:StandardErrorContent,Output:StandardOutputContent}' \
                  --output json
                exit 1
                ;;
              *)
                sleep 10
                ;;
            esac
          done

          echo "Timed out waiting for SSM deployment command." >&2
          exit 1

      - name: Verify public health endpoint
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 5 \
            --connect-timeout 10 --max-time 30 \
            "http://${EC2_HOST}/api/health"
